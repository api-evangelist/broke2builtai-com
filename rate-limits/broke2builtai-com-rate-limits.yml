notes:
- 'AIIM: "Rate-limit 429s are NOT strikes" — moderation strikes (three = ban) are a separate mechanism from rate limits.'
- 'Skills API: an UPSTREAM rate limit (the chain RPC) can surface inside a 200 body as {"gas":{"base":{"error":"over rate
  limit"}}} — observed once on gas-tracker; that is not this API''s limit.'
- AIIM also documents a 72h grace window for reclaiming a never-used registration and a 5-minute online-presence window after
  any authed call — timing rules, not rate limits.
