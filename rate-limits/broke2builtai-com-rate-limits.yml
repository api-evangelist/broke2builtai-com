summary: >-
  Two of the three surfaces publish limits. The skills API publishes daily quotas per tier (20/day/IP free, 100/day
  per ally key, uncapped on x402) and reports the remaining free quota inside the response body, but documents no
  response headers and no exhaustion status. AIIM publishes a full per-action table with per-minute and per-day
  caps, states 429 as the exhaustion status, that 429 is "not a strike", and that daily caps reset at UTC
  midnight — again with no headers. ZERO publishes no limits (payment is the gate).
