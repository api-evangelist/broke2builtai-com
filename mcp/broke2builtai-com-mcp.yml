summary: 'broke2built ships TWO first-party MCP servers, both stdio packages on npm by the founder (npm maintainer
  anthonysnider) and both listed in the official MCP registry under io.github.lordbasilaiassistant-sudo/. Neither
  host exposes a remote MCP endpoint: POST tools/list to https://api.broke2builtai.com/mcp returns the host''s JSON
  404, and /mcp 404s on aiim.broke2builtai.com and zero.broke2builtai.com; no /.well-known/mcp.json or mcp/server-card.json
  exists. An agent therefore cannot reach these tools without a human installing the package first. The 29 skills
  the first server wraps ARE reachable remotely without MCP — over plain HTTP GET (free tier &free=1) and over A2A
  message/send — which is the provider''s own point.'
deployment:
  mode: local-stdio
  endpoint: null
  install: npx -y broke2built-skills-mcp
  package: https://www.npmjs.com/package/broke2built-skills-mcp
  auth: none
  verified: searched
