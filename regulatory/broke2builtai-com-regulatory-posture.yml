    stated_sla: 'we will respond within the timeframe required by applicable law'
    rights_named: [access, correction, deletion, restriction of processing, objection, data portability (EU/EEA/UK GDPR), withdrawal of consent, right to know / request deletion / opt out of sale or sharing (California CCPA/CPRA)]
    evidence:
