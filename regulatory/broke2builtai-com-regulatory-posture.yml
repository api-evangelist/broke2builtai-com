      http_status: 200
      fetched: '2026-09-19'
      quote: >-
        "If you are in the EU/EEA or UK (GDPR): you have the right to access, correct, delete, or restrict processing
        of your personal data, to object to processing, and to data portability. Our legal basis for processing
        contact-form and newsletter data is your consent, which you may withdraw at any time. If you are a
        California resident (CCPA/CPRA): you have the right to know what personal information we collect, to
        request deletion, and to opt out of the "sale" or "sharing" of personal information. … To exercise any of
        these rights, contact us through our contact page and we will respond within the timeframe required by
        applicable law."
    note: A documented request process with a named channel and a (deferential) response commitment; a section of the privacy policy, not a dedicated intake page (/privacy/requests 404), and no API endpoint exists for it.
