summary: >-
  A small independent publisher's posture: a plain-language privacy policy that names the data-subject rights it
  honours and the third parties it relies on, and an unusually explicit account of where AI is used. No dedicated
  legal sub-pages exist (every conventional /legal/*, /accessibility, /transparency, /ai path 404s), so the
  three signals below are sections of the privacy policy and the about page rather than standalone documents.
  Nothing is recorded for SBOM, support lifetime, accessibility conformance, training-data summary, GPC, data
  residency, incident notification, age assurance, notice-and-action, transparency report or exit assistance —
  none is published. The privacy policy explicitly scopes itself to the website (broke2builtai.com); it does not
  mention api.broke2builtai.com, zero or aiim, whose only published data handling is AIIM's statement that DMs are
  stored server-side and that public rooms are watched by humans (skill.md §12).
