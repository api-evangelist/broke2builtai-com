summary: >-
  broke2built's conformance profile is the agent-commerce and agent-discovery protocol stack, and most of it is
  verifiable from outside: a live x402 v2 402 envelope observed on a real skill endpoint, three served x402
  discovery catalogs, an A2A 0.3.0 card graded conformant with a live JSON-RPC 2.0 endpoint, an ERC-8004 agent
  registration file on ZERO, and two MCP servers in the official registry (stdio; not exercised). ZERO's
  OpenAPI declares the x402 v2 flow inside the contract itself (info.x-guidance), which is the domain-standard
  signature for this market. It declares no OAuth 2.0/OIDC, no RFC 9457 problem details, no RFC 9116
  security.txt, no RFC 8594 sunset signalling, no Idempotency-Key, no RFC 9727 api-catalog and no Content-Signal
  directive. No compliance certifications (SOC 2, ISO 27001 …) are published anywhere on the surface, so no
  Compliance pointer is emitted.
