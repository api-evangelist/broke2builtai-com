- id: x402
  name: x402 HTTP payment protocol
  version: '2'
  conforms: true
  verification: observed
  evidence: >-
    GET https://api.broke2builtai.com/verify-email?email=test@example.com (no free flag, no key) returned HTTP 402,
    application/json, {"x402Version":2,"resource":{url,description,mimeType},"accepts":[{scheme exact, network
    solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp, amount "2000", payTo BNXmQ1Jo1QHuD5eboNeH2b2p44rnuxjtk7oTCdLg8VHB,
    maxTimeoutSeconds 300, asset EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v, extra {feePayer, description,
    mimeType, resource}}],"error":"Payment required"}. The host also serves /.well-known/x402 (x402Version 2, 29
    items with accepts[] and inputSchema) — saved as well-known/broke2builtai-com-x402.json. The root catalog
    names the facilitator https://facilitator.payai.network.
  note: The paid retry was not exercised (it requires spending USDC). The published OpenAPI for this host does NOT declare the 402 response or an x402 security scheme — the x402 contract lives in the 402 itself and the discovery document, not in the OpenAPI.
  domain_standard_signature: true
  domain_standard_evidence: openapi/broke2builtai-com-zero-openapi.json info.x-guidance declares the x402 v2 flow verbatim ("HTTP 402 with an x402 v2 base64 Payment-Required header (scheme \"exact\", network eip155:8453, USDC 0x8335…2913)"); zero's ERC-8004 file lists a service of type x402; three /.well-known/x402 catalogs are served.
- id: x402-zero
  name: x402 on ZERO (Base)
  version: '1 body / 2 header'
  conforms: true
  verification: observed
  evidence: >-
    GET https://zero.broke2builtai.com/api/contract-audit (no params, no payment) returned HTTP 402 with a JSON body
    {"x402Version":1,"error":"payment required","accepts":[{scheme exact, network base, maxAmountRequired "50000",
    payTo 0x75d93b33708e7cf5eb4dcf14dfc25254f5d5817f, asset 0x833589…2913, maxTimeoutSeconds 3600}],
    "how_to_pay_without_an_x402_client":{…}} AND a base64 PAYMENT-REQUIRED response header decoding to a v2
    envelope (x402Version 2, amount "50000", network eip155:8453, extensions.bazaar with input schema and output
    example). Access-Control-Expose-Headers names Payment-Required and X-Payment-Response.
  note: The body and the discovery catalog are v1-shaped while the header is v2-shaped; a strict v2 client reads the header, a v1 client reads the body, and both work. Recorded as a deviation, not a failure.
