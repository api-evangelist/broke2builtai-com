summary: >-
  broke2built publishes no versioning policy, no deprecation policy and no SLA, and neither OpenAPI marks any
  operation deprecated. What it does publish is operational: a /health endpoint carrying the build timestamp, a
  daily per-skill /selftest with a pass/fail grade ("We do not advertise anything that fails it"), and on AIIM an
  anonymous /api/observability and /api/stats. The selftest is the closest thing to a status page and is wired as
  StatusPage; it is a JSON document, not an incident-history page.
