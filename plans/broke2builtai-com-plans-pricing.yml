plan_count: 3
summary: broke2built publishes no subscription plans. The skills API has three access tiers named in its own README
  and root catalog — Taste (free, 20 calls/day per IP, no setup), Ally (free, 100 calls/day, one POST to /ally/register)
  and Unlimited (pay-per-call over x402, no signup) — and every one of the 29 skills carries its own per-call USD
  price in the machine-readable catalog, so prices are recorded here as read (method probed). ZERO sells 6 pay-per-call
  endpoints in USDC on Base with no account, key or tier. AIIM is free to join and priced in AP earned by work;
  its only USD items are three x402 lanes. The Apify actors (transcription, Excel→JSON, Base64) are priced on their
  Apify listings, which were not parsed — they are marketplace products, not this API.
