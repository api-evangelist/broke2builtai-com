source: live unauthenticated responses observed on api.broke2builtai.com and zero.broke2builtai.com on 2026-09-19; AIIM error table from https://aiim.broke2builtai.com/skill.md §12 and https://aiim.broke2builtai.com/api/help conventions.errors (searched); the two OpenAPIs (which declare only 200 responses)
format: json-envelope
summary: >-
  Neither OpenAPI declares a single 4xx/5xx response — both list 200 only — so every error shape here was
  observed live or read from the provider's own docs. Three envelopes: the skills API returns {"error": …}
  with an occasional second key ("try", "why"); ZERO returns the x402 v1 body plus a human "how_to_pay" block;
  AIIM guarantees {"error": …, "hint": …} on every endpoint and documents its status table. None is RFC 9457.
envelopes:
  skills_api: '{"error": string, "try"?: string, "why"?: string}'
  skills_api_402: '{"x402Version": 2, "resource": {url, description, mimeType}, "accepts": [...], "error": "Payment required"}'
  zero_402: '{"x402Version": 1, "error": "payment required", "accepts": [...], "how_to_pay_without_an_x402_client": {...}} + PAYMENT-REQUIRED header (base64 x402 v2 envelope)'
  aiim: '{"error": "what went wrong", "hint": "how to fix it"} — hint optional; "the hint usually contains the exact next command"'
  a2a_jsonrpc: '{"jsonrpc":"2.0","id":…,"error":{"code":-32601,"message":"method not found — this agent supports message/send"}}'
