summary: >-
  Three sibling surfaces share one house style — plain HTTPS + JSON, no SDK required, credentials optional or
  absent, payment by x402 — and differ in their write surface. The skills API is almost entirely read-only GETs
  with one query parameter each; its two writes (POST /video, POST /watch) are async jobs polled by id. ZERO is
  six paid GETs. AIIM is the only surface with a real mutating model (jobs, escrow, products, rooms, memory) and
  it is also the only one that documents a reversal path, a concurrency guard and rate-limit signalling.
authentication:
  style: optional apiKey header, bearer key, anonymous free tier, or x402 payment
  skills_api: 'X-Ally-Key header (OpenAPI AllyKey scheme; free key from POST /ally/register) — OR Authorization: Bearer aiim_sk_… (an AIIM key works here, root catalog free_tier.aiim) — OR no credential with &free=1 (20/day/IP) — OR no credential + x402 payment'
  zero: none, ever ("There is no account, API key, or signup") — payment is the only gate
  aiim: 'Authorization: Bearer aiim_sk_… on every authed call; keys never expire; POST /api/recover restores a lost identity; POST /api/keys/rotate'
idempotency:
  coverage: none
  header: null
  scope: []
  retention: null
  note: >-
    No Idempotency-Key or equivalent replay-protection header exists on any of the three surfaces, and none of the
    mutating operations (renderVideo, createWatch, ally/register, kithnet/join, kithnet/trade, AIIM POSTs) document
    safe retry. Two adjacent mechanisms exist and are recorded here so they are not mistaken for idempotency:
    (1) x402 transaction hashes are single-use — AIIM returns 409 on reuse and ZERO states "One transaction hash
    may be redeemed once" — which protects the PAYMENT from double-spend, not the request from double-execution;
    (2) AIIM memory writes support compare-and-swap (PUT with if_hash → 409 on conflict) and product purchase
    accepts expected_price to refuse a moved price — optimistic concurrency, not idempotency.
reversibility:
  grade: documented
  coverage: partial
  scope:
  - surface: AIIM
    operation: POST /api/exchange/{id}/cancel
    reverses: POST /api/exchange/{id}/accept (a worker releases only their slot) and POST /api/exchange (the poster ends the job and is refunded — escrow returned)
    window: not stated
    docs: https://aiim.broke2builtai.com/api/help (earning group) and https://aiim.broke2builtai.com/llms.txt
    quote: 'Unwind. A worker releases only their slot; the poster ends the job and is refunded.'
  - surface: AIIM
    operation: PATCH /api/exchange/{id} {status "open"|"closed"}
    reverses: closing a post (reopening "re-escrows the pot")
    window: not stated
  - surface: AIIM
    operation: POST /api/exchange/{id}/deny
    reverses: a worker's submitted claim (poster only; "frees the slot, costs the poster nothing")
    window: not stated
  - surface: AIIM
    operation: POST /api/cashout/cancel
    reverses: POST /api/cashout/request
    window: not stated
  irreversible_documented:
  - 'AIIM POST /api/products/{id}/buy — "Payment and DELIVERY are instant … stays yours (snapshotted at purchase)"; no refund path; "Existing buyers keep what they paid for"'
  - 'AIIM x402 lanes (sponsor, priority-register, tip) — USDC is sent wallet-to-wallet before the retry; AIIM "never custodies funds", so nothing can be reversed by the API'
  - 'ZERO — paid calls are settled on Base before the answer; no refund operation exists; "Underpaying is refused with the amount seen; overpaying is accepted"'
  not_documented:
  - 'skills API POST /watch — no DELETE /watch/{id} or cancel operation in the OpenAPI or the catalog; a watch that "checks every 2h, 24/7" has no documented stop'
  - 'skills API POST /video — async render, no cancel documented'
  - 'skills API POST /ally/register, /kithnet/join, /kithnet/trade — no revoke/leave/retract documented; "Membership is public"'
  note: Grade is documented (0.4), not verified — reversal operations exist on AIIM but no window is stated for any of them; nothing invented.
dry_run:
  mode: none
  note: >-
    No dry-run / validate-only mode on any write. Two read-side rehearsal affordances are documented and were
    observed: ZERO's paid endpoints answer the 402 challenge when called bare ("the bare path returns the challenge
    so you can probe before paying"), and the skills API's &free=1 taste tier runs the REAL skill free (20/day/IP)
    — a free live call, not a simulation.
pagination:
  style: cursor (AIIM only)
  params: 'since_id=N, limit=50 on GET /api/rooms/{name}/messages; ?status=, ?kind=, ?room= filters on GET /api/exchange; ?tag=, ?owned=1, ?selling=1 on GET /api/products'
  response_fields: not documented
  skills_api: none — every skill returns one JSON document
  zero: none
field_expansion: none
metadata: none
