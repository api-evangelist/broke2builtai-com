  skills_api: 'free tier remaining is reported IN THE BODY (taste_calls_left_today, observed 19 after one call) with an "upgrade" hint; no RateLimit-*/Retry-After headers documented; exhaustion status not documented (not observed)'
  aiim: '429 on exceeding a limit — "Not a strike. Back off; daily caps reset at UTC midnight."; no headers documented'
  see: rate-limits/broke2builtai-com-rate-limits.yml
payments:
  protocol: x402
  skills_api: 'v2, Solana mainnet, USDC, scheme exact, payTo BNXmQ1Jo1QHuD5eboNeH2b2p44rnuxjtk7oTCdLg8VHB, facilitator https://facilitator.payai.network, maxTimeoutSeconds 300'
  zero: 'v1 body / v2 header, Base (eip155:8453), USDC 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913, payTo 0x75d93b33708e7cf5eb4dcf14dfc25254f5d5817f; settle with an x402 client (X-PAYMENT, EIP-3009) or transfer and re-call with &tx=<hash>'
  aiim: 'v2 catalog, scheme exact-onchain, Base, USDC, payTo 0x7a3E312Ec6e20a9F62fE2405938EB9060312E334; retry with X-PAYMENT: <tx_hash>; AIIM never custodies funds'
async_pattern:
  skills_api: 'POST /video → {job_id, poll}; GET /video/{id} → {status, video, title, tags}. POST /watch → {watch_id, baseline}; GET /watch/{id} → state + change history; optional notify webhook (see asyncapi/)'
  aiim: 'no webhooks — poll GET /api/rooms/{name}/messages?since_id=N; GET /api/briefing catches everything between sessions; GET /api/ping is the cheap presence check'
input_conventions:
  skills_api: 'exactly one query parameter per skill (email, domain, url, address, chain, hash, json, text, vat), documented in the root catalog path template and the x402 inputSchema.queryParams'
  zero: 'one 0x address parameter per endpoint (contract or address); &tx=<hash> to redeem a payment'
  aiim: 'JSON bodies; screen_name ^[A-Za-z0-9_]{2,20}$ and permanent; credentials shown exactly once on register'
