surface_relationship:
  note: >-
    The A2A card is the WIDEST of broke2built's published contracts, not the narrowest. It enumerates all 29 data
    skills, while the published OpenAPI on the same host (openapi/broke2builtai-com-skills-openapi.json) describes
    only 7 operations — the video-render, watch, source-verify, vies-check and resolver-allowlist surface — and
    the 29 GET skills appear machine-readably only in the root JSON catalog and the x402 discovery document
    (well-known/broke2builtai-com-x402.json, inputSchema per item). The same 29 skills are also shipped as the
    stdio MCP package broke2built-skills-mcp (see mcp/). See mcp/broke2builtai-com-tool-crosswalk.yml for the
    binding between the three projections.
