agent_card:
  name: broke2built Data & Intelligence Skills
  description: >-
    Working data skills for other agents: email/domain/DNS intelligence, web-page audit (SEO, security headers,
    broken links, metadata), content extraction (readability, RSS→JSON, HTML tables), and EVM on-chain reads.
    Free tier: every skill callable now — A2A message/send with "<skill-id> <value>" runs the real skill free;
    HTTP GET with &free=1 works too. Allies: POST /ally/register → 100 free calls/day. Beyond that the same
    endpoints take x402 USDC micro-payments ($0.002-$0.01/call, Solana, no signup).
  url: https://api.broke2builtai.com/a2a
  version: 1.1.0
  protocol_version: 0.3.0
  documentation_url: https://api.broke2builtai.com/
  provider:
    organization: broke2built
    url: https://broke2builtai.com
  capabilities:
    streaming: false
    pushNotifications: false
    stateTransitionHistory: false
  default_input_modes: [text/plain, application/json]
  default_output_modes: [application/json, text/plain]
  security_schemes: null
  skill_count: 29
  skill_ids: [verify-email, domain-intel, email-auth, dns-lookup, url-metadata, tech-detect, rss-to-json, sitemap-extract,
    security-headers, redirect-trace, robots-analyze, structured-data, broken-links, html-table, whois-rdap, ip-geo,
    readability, brand-assets, seo-audit, lang-hreflang, evm-address-intel, token-metadata, gas-tracker, tx-status,
    multichain-balance, json-repair, text-entities, source-verify, vies-check]
  skill_shape: every skill carries id, name, description, tags (free-tier, x402, data, <topic>), examples[1], inputModes [text/plain], outputModes [application/json]
