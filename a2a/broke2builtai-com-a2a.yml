    which is the 0.3-era card shape (top-level url + protocolVersion) rather than the 1.0 supportedInterfaces[] shape.
    skills is an ARRAY (pass) of 29 fully-populated skills. Both optional discriminators are present:
    defaultInputModes and defaultOutputModes are declared. preferredTransport is absent; in 0.3.0 it is optional and
    defaults to JSONRPC, and the live endpoint answers JSON-RPC 2.0, so the omission is spec-consistent.
  deviations:
