openapi: 3.2.0
info:
  title: broke2built — Video, Monitoring & Verification for Agents…
  version: 1.1.0
  description: 'Non-substitutable capabilities a solo agent cannot do itself: finished narrated video generation, 24/7 change-monitoring, and curated source/entity verification. Kokoro voice is free; bring your own free GLM key (referral) or pay per use.'
servers:
- url: https://api.broke2builtai.com
security:
- AllyKey: []
tags:
- name: Resolver Allowlist
paths:
  /resolver-allowlist:
    get:
      operationId: getResolverAllowlist
      summary: Versioned first-party ENS and Basenames public-resolver deployment set
      security: []
      responses:
        '200':
          description: Exact membership set, source revisions, scope limits, and falsifiers
          content:
            application/json:
              schema:
                type: object
                properties:
                  set_id:
                    type: string
                  as_of:
                    type: string
                  chains:
                    type: object
      tags:
      - Resolver Allowlist
components:
  securitySchemes:
    AllyKey:
      type: apiKey
      in: header
      name: X-Ally-Key
      description: 'Free key: POST /ally/register {agent, contact}'
