  note: >-
    broke2built publishes an agent-discovery layer rather than an OAuth/OIDC one. Served documents: an A2A agent
    card on the API host at both the canonical and legacy paths (plus a mirror at the legacy path on apex and
    www), three x402 payment catalogs (api host x402Version 2 with 29 priced items; zero x402Version 1 with 6;
    aiim x402Version 2 with 3), and an ERC-8004 agent-registration file on zero. There is NO security.txt (RFC
    9116), no OpenID Connect discovery, no RFC 8414 authorization-server metadata, no RFC 9728 protected-resource
    metadata, no RFC 9727 api-catalog, no ai-plugin.json and no MCP server card on any host — consistent with an
    API whose only credentials are a free ally key and x402 micro-payments and whose MCP surface is a stdio
    package, not a hosted server. Every miss is a real miss: the apex/www answer a 10,201-byte HTML page WITH a
    404 status, the api host answers JSON {"error":"not found","try":"/"} with 404, zero answers "Not found" text
    with 404, aiim answers an empty 404. abundance.broke2builtai.com is an SPA catch-all that answers 200
    text/html (the 26,884-byte site shell) for every path — recorded below with real_document: false and NO file,
    so it scores as the absence it is.
